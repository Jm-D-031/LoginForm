{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dorado{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
<div class="auth">

  <aside class="auth__panel">
    <span class="auth__brand">DORADO</span>
    <span class="auth__step">{% block panel_label %}{% endblock %}</span>
  </aside>

  <div class="auth__main">
    <header class="auth__top">
      <span class="auth__crumb">{% block crumb %}{% endblock %}</span>
      <a href="#" class="auth__help">Help</a>
    </header>

    <main class="auth__center">
      {% block content %}{% endblock %}
    </main>

    <footer class="auth__foot">
      <span>© Dorado</span>
      <span class="auth__legal"><a href="#">Privacy</a> · <a href="#">Terms</a></span>
    </footer>
  </div>

</div>
</body>
</html>
